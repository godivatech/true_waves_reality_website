kind = "web"
previewPath = "/"
title = "True Waves Realty"
version = "1.0.0"
id = "artifacts/true-waves-realty"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21377

[services.development]
run = "pnpm --filter @workspace/true-waves-realty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/true-waves-realty", "run", "build" ]
publicDir = "artifacts/true-waves-realty/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21377"
BASE_PATH = "/"
